name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA, not a moving tag. A tag
      # can be repointed at new code by whoever controls the repository; a SHA
      # cannot. This is the same argument as the committed lockfile below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      # Separate step so a failure here reads unambiguously as "lockfile drift"
      # rather than as a dependency-installation problem.
      - name: Lockfile agrees with pyproject.toml
        run: uv lock --check

      # --locked verifies the lockfile and refuses to re-resolve. Never --frozen,
      # which skips verification and will happily install a stale graph.
      - name: Install exactly what the lockfile pins
        run: uv sync --locked --dev

      # --no-sync because a bare `uv run` re-syncs first and can rewrite uv.lock.
      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test
        run: uv run --no-sync pytest -q

      # Hash verification is on by default in uv. Turning it off takes an explicit
      # flag, which is exactly the kind of thing that gets added during a
      # debugging session and never removed.
      - name: Hash verification is not disabled anywhere
        run: |
          if grep -rInE -- '--no-verify-hashes|UV_NO_VERIFY_HASHES' \
              --exclude=ci.yml --exclude-dir=.git . ; then
            echo "::error::uv hash verification is disabled in this repository"
            exit 1
          fi
          echo "ok: hash verification is not disabled"
